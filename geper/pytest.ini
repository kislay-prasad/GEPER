[pytest]
markers =
    real_pip: opt-in integration test that shells out to a real `pip install`/`pip uninstall` against whatever Python interpreter runs it. Never selected by a bare `pytest` invocation -- deliberately excluded by `addopts` below, since firing real pip against a SHARED interpreter (as opposed to a disposable/isolated one) has a demonstrated collision/removal risk. Run explicitly and only against a disposable environment via `pytest -m real_pip`.
addopts = -m "not real_pip"
