# mypy configuration, scoped deliberately narrow -- NOT project-wide.
#
# WHY THIS SCOPE: these files are the ACMG interpretation path --
# exactly where the PM1 bug lived (a None flowing where a residue number
# was expected, caught only at runtime -- see PM1 fix, 2026-07-31). The
# goal is catching that class of bug (wrong-shaped value silently crossing
# a function boundary) earlier, not blanket type coverage across a
# codebase that leans on dynamic provider dicts (ClinVar/gnomAD/ClinGen
# API responses) by design elsewhere.
#
# Extended (report review round 5, G1) to cover the rest of the ACMG
# interpretation path: the whole `pvs1/` package (not just `utils.py` --
# `decision_tree.py`, `models.py`, and `lookup.py` all carry the same
# transcript-coordinate arithmetic PM1 broke on), the conflict-resolution
# engine, and the two modules the D1/F1a provenance/status fixes added
# (`provenance.py`, `models/status.py`). This pass found 21 real mypy
# errors across 5 files, all fixed without changing runtime behavior
# (missing None-guards around `Optional[int]`/`Optional[CodingSpan]`
# arithmetic -- the exact "missing-vs-empty" bug class this project has
# repeatedly hit -- plus one genuine latent bug: `pipeline/pvs1/lookup.py`
# checked `start is not None` but not `end is not None` before comparing
# both against `variant.pos`, which a malformed `transcript_span` could
# have turned into a real `TypeError`, not just a type-checker complaint).
#
# `geper/` (not the repo root) is the import root: this codebase's own
# modules import each other as `from pipeline.acmg_rules import ...`,
# `from config import CONFIG`, `from utils.logger import get_logger`,
# with no `geper.` package prefix -- so mypy_path points at `geper` to
# resolve those the same way Python does at runtime (geper/ on sys.path).
[mypy]
mypy_path = geper
explicit_package_bases = True
namespace_packages = True
python_version = 3.12

files =
    geper/pipeline/acmg_rules.py,
    geper/pipeline/interpretation.py,
    geper/pipeline/interpretation_result.py,
    geper/pipeline/stage_schemas.py,
    geper/pipeline/interpro/lookup.py,
    geper/pipeline/pvs1/__init__.py,
    geper/pipeline/pvs1/cache.py,
    geper/pipeline/pvs1/decision_tree.py,
    geper/pipeline/pvs1/lookup.py,
    geper/pipeline/pvs1/models.py,
    geper/pipeline/pvs1/utils.py,
    geper/pipeline/conflict_resolution_engine.py,
    geper/pipeline/provenance.py,
    geper/pipeline/models/status.py

# Only warn inside the scoped files themselves; a third-party or
# untyped-internal import (e.g. pydantic, or a sibling module outside
# scope that has no annotations at all) shouldn't fail the run just
# because mypy can't fully resolve everything it transitively touches.
follow_imports = silent
ignore_missing_imports = True

# Meaningful-bug-catching checks: on.
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True

# Deliberately NOT enabled: disallow_untyped_defs / strict mode. Several
# functions in this scope (see the "left unfixed" notes added inline
# during the first mypy pass) take/return provider-shaped `Dict[str, Any]`
# blobs (ClinVar, gnomAD, ClinGen, InterPro API responses) whose shape is
# genuinely variable -- annotating those as anything more specific than
# `Dict[str, Any]` would be fiction, not safety. Ratchet this up later if
# the scope narrows to fully-typed internal data structures.

# pydantic's own mypy plugin understands BaseModel/model_validator/Field
# semantics (stage_schemas.py is Pydantic v2) precisely enough to avoid
# false positives a plain mypy pass would raise on those patterns.
plugins = pydantic.mypy
